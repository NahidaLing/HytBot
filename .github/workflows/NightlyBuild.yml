name: NightlyBuild

on:
    push:
        branches: [ "main" ]
    pull_request:
        branches: [ "main" ]

jobs:
    build:

        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - uses: actions/checkout@v4
            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  distribution: 'adopt'
                  java-version: '22'
                  java-package: jdk

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v4

            - name: Build
              run: |
                  chmod +x ./gradlew
                  ./gradlew build

            - name: Upload Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: HytBot
                  path: build/libs/*.jar
              continue-on-error: true